spring:
  application:
    name: retail-ai-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/retail_dev}
    username: ${DB_USER:retail_app}
    password: ${DB_PASSWORD}   # no default: a published password must not be a silent fallback
  flyway:
    enabled: true
    locations: classpath:db/migration
